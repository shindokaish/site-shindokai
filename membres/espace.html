<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Espace — EKSN</title>
<link rel="icon" href="../shinodkai.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
body { background: #0d0d10; min-height: 100vh; }
.m-header {
  background: var(--char); border-bottom: 1px solid rgba(201,162,39,.2);
  padding: 1rem 0; position: sticky; top: 0; z-index: 50;
}
.m-header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.m-header__logo { display: flex; align-items: center; gap: .6rem; }
.m-header__logo img { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(201,162,39,.3); }
.m-header__logo span { font-family: var(--display); font-size: 1.1rem; color: var(--gold); text-transform: uppercase; }
.m-hello { font-family: var(--eyebrow); font-size: .85rem; color: var(--ash); }
.m-hello strong { color: var(--bone); }
.btn-deconnect {
  font-family: var(--mono); font-size: .7rem; color: var(--ash-2);
  border: 1px solid var(--line); padding: .4rem .8rem;
  background: none; cursor: pointer; transition: color .2s, border-color .2s;
}
.btn-deconnect:hover { color: var(--crimson-2); border-color: var(--crimson-2); }

.m-welcome {
  text-align: center; padding: 6rem 2rem;
}
.m-welcome__logo {
  width: 90px; height: 90px; border-radius: 50%;
  border: 2px solid rgba(201,162,39,.3); padding: 6px; margin: 0 auto 2rem;
  animation: spinSlow 20s linear infinite;
}
@keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.m-welcome__logo img { width: 100%; border-radius: 50%; }
.m-welcome__title {
  font-family: var(--display); font-size: 2.4rem; text-transform: uppercase;
  background: linear-gradient(135deg, #e8c050, var(--gold));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: .8rem;
}
.m-welcome__sub { font-family: var(--mono); font-size: .85rem; color: var(--ash); line-height: 1.7; }
.m-coming {
  display: inline-block; margin-top: 2.5rem;
  font-family: var(--eyebrow); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ash-2); border: 1px solid var(--line); padding: .6rem 1.4rem;
}
</style>
</head>
<body>

<header class="m-header">
  <div class="wrap">
    <div class="m-header__logo">
      <img src="../shinodkai.png" alt="EKSN">
      <span>Espace Membres</span>
    </div>
    <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
      <span class="m-hello">Bienvenue, <strong id="prenomDisplay">—</strong></span>
      <button class="btn-deconnect" id="deconnectBtn">Se déconnecter</button>
    </div>
  </div>
</header>

<main>
  <div class="m-welcome">
    <div class="m-welcome__logo">
      <img src="../shinodkai.png" alt="Logo EKSN">
    </div>
    <div class="m-welcome__title">Dojo numérique</div>
    <p class="m-welcome__sub">
      Ton espace membres est en cours de construction.<br>
      Des contenus exclusifs arrivent bientôt — quiz, ressources, actualités privées.
    </p>
    <div class="m-coming">Contenu à venir</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const _sb = supabase.createClient('https://jcfltkuobbjqicczpsjn.supabase.co','sb_publishable_15BDd64WYwMfW8VV9ZXDqg_Oa2ySvKc');

_sb.auth.getSession().then(({ data }) => {
  if (!data.session) { window.location.href = 'index.html'; return; }
  const user = data.session.user;
  const prenom = user.user_metadata.prenom || user.email.split('@')[0];
  document.getElementById('prenomDisplay').textContent = prenom;
});

document.getElementById('deconnectBtn').addEventListener('click', async () => {
  await _sb.auth.signOut();
  window.location.href = 'index.html';
});
</script>
</body>
</html>
