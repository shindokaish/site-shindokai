<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Dojos — EKSN</title>
<meta name="description" content="Cours, plannings et dojos EKSN. Trouvez votre dojo dans le Nord (59) — 3 sites avec les mêmes coachs diplômés FFKDA.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://site-shindokai.vercel.app/dojos.html">
<meta property="og:title" content="Les Dojos — EKSN">
<meta property="og:description" content="Cours, plannings et dojos EKSN. Trouvez votre dojo dans le Nord (59).">
<meta property="og:image" content="https://site-shindokai.vercel.app/shinodkai.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Les Dojos — EKSN">
<meta name="twitter:description" content="Cours, plannings et dojos EKSN.">
<meta name="twitter:image" content="https://site-shindokai.vercel.app/shinodkai.png">
<link rel="icon" href="shinodkai.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
/* ── Bloc dojo défilant ── */
.dojo-block {
  border: 1px solid var(--line);
  background: var(--char);
  margin-bottom: 4rem;
}
.dojo-block__header {
  display: flex; align-items: center; gap: 1.2rem;
  padding: 2rem 2.4rem;
  border-bottom: 2px solid var(--crimson-2);
  background: linear-gradient(135deg, var(--char-2), var(--void));
}
.dojo-block__logo { width: 56px; height: 56px; object-fit: contain; flex-shrink: 0; }
.dojo-block__name {
  font-family: var(--display); font-size: 1.8rem; text-transform: uppercase;
  color: var(--bone); letter-spacing: .04em;
}
.dojo-block__sub { font-family: var(--mono); font-size: .72rem; color: var(--ash-2); margin-top: .2rem; }

/* ── Sous-sections ── */
.dojo-subsection { padding: 2rem 2.4rem; border-top: 1px solid var(--line); }
.dojo-subsection:first-of-type { border-top: none; }
.dojo-subsection__title {
  font-family: var(--eyebrow); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--crimson-2); margin-bottom: 1.4rem;
  display: flex; align-items: center; gap: .5rem;
}
.dojo-subsection__title::after {
  content: ''; flex: 1; height: 1px; background: var(--line);
}

/* ── Bureau grid ── */
.bureau-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 160px)); justify-content: center; gap: .8rem; }
@media (max-width: 700px) { .bureau-grid { grid-template-columns: 1fr 1fr; } }
.bureau-grid .coach-card__photo { height: 160px; }
.bureau-grid .coach-card__name { font-size: .75rem; }
.bureau-grid .coach-card__grade { font-size: .62rem; }
.bureau-grid .coach-card__body { padding: .6rem .8rem .8rem; }
.bureau-grid .coach-card__contact {
  display: flex; flex-direction: column; gap: .3rem; margin-top: .4rem; padding: 0 1rem .8rem;
}
.bureau-grid .coach-card__contact a {
  font-size: .75rem; color: var(--ash); text-decoration: none;
  display: flex; align-items: center; gap: .4rem; transition: color .2s;
}
.bureau-grid .coach-card__contact a:hover { color: var(--gold); }

/* ── Infos dojo ── */
.dojo-info-list {
  display: flex; flex-direction: column; margin-bottom: 1.6rem;
}
.dojo-info-list .dojo-item { display: flex; gap: 1rem; padding: .75rem 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.dojo-info-list .dojo-item:first-child { padding-top: 0; }
.dojo-info-list .dojo-item:last-child { border-bottom: none; }
.dojo-info-list .dojo-item__label {
  font-family: var(--eyebrow); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ash-2); width: 160px; flex-shrink: 0;
}
.dojo-info-list .dojo-item__value { color: var(--bone); font-size: .9rem; }
</style>
</head>
<body>

<div id="nav-placeholder"></div>

<main>

<section class="hero-mini">
  <div class="hero-mini__bg"></div>
  <img class="hero-mini__logo-bg" src="shinodkai.png" alt="" aria-hidden="true">
  <svg class="hero-mini__strike" viewBox="0 0 400 1000" preserveAspectRatio="none" fill="none">
    <path d="M380 0 L20 1000" stroke="#e0241b" stroke-width="2" opacity="0.4"/>
  </svg>
  <div class="wrap">
    <div class="hero-mini__content">
      <span class="eyebrow-text hero-mini__eyebrow">Les Dojos</span>
      <h1 class="hero-mini__title">
        <span class="line"><span>Cours, horaires</span></span>
        <span class="line"><span>& lieux.</span></span>
      </h1>
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="section__head reveal">
      <span class="eyebrow-text">Nos sites</span>
      <h2 class="section__title">Trois dojos,<br>un seul esprit.</h2>
      <p class="section__lede">Mêmes coachs diplômés, même enseignement, même exigence sur les trois sites.</p>
    </div>
    <div class="dojos-tabs reveal" id="dojosTabs"></div>
    <div id="dojosContainer"></div>
  </div>
</section>

<section class="cta-band">
  <div class="wrap">
    <h2 class="cta-band__title reveal">Prêt à nous rejoindre ?</h2>
    <p class="cta-band__sub reveal">Venez essayer gratuitement dans le dojo de votre choix. Aucun équipement requis.</p>
    <div class="cta-band__btns reveal">
      <a href="inscription.html" class="btn btn--primary">S'inscrire</a>
      <a href="contact.html" class="btn btn--ghost">Nous contacter</a>
    </div>
  </div>
</section>

</main>

<div id="footer-placeholder"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/admin-bar.js"></script>
<script>
initData().then(() => {
pageInit('dojos');

const dojos     = getSection('dojos') || [];
const plannings = getSection('plannings') || [];
const dojosTabs = document.getElementById('dojosTabs');
const container = document.getElementById('dojosContainer');

function bureauCard(role, icon, name, phone, email, photo, initials) {
  const ini = initials || (name ? name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase() : '?');
  const card = buildCoachCard({
    name: name || 'À renseigner',
    photo: photo || '',
    initials: ini,
    grade: `${icon} ${role}`,
    role: '',
    bio: '',
    dojo: ''
  }, false);
  // Ajouter téléphone / email sous la carte
  if (phone || email) {
    const contacts = document.createElement('div');
    contacts.className = 'coach-card__contact';
    if (phone) contacts.innerHTML += `<a href="tel:${esc(phone)}">📞 ${esc(phone)}</a>`;
    if (email) contacts.innerHTML += `<a href="mailto:${esc(email)}">✉️ ${esc(email)}</a>`;
    card.appendChild(contacts);
  }
  return card;
}

dojos.forEach((d, i) => {
  const shortName = d.name.replace(/^Dojo d[e']?\s*/i, '');

  // ── Onglet ──
  const btn = document.createElement('button');
  btn.className = 'dojo-tab' + (i === 0 ? ' is-active' : '');
  btn.textContent = shortName;
  btn.dataset.index = i;
  dojosTabs.appendChild(btn);

  // ── Cours ──
  const planning = plannings.find(p => p.dojo === d.name) || plannings[i] || null;
  const cours = planning ? (planning.cours || []).filter(c => c.name !== 'Compétition') : [];
  const coursHTML = cours.length
    ? '<div class="planning-grid">' + cours.map(c => `
        <div class="planning-card">
          <div class="planning-card__belt" style="background:${esc(c.belt)}"></div>
          <div class="planning-card__age">${esc(c.age)}</div>
          <div class="planning-card__name">${esc(c.name)}</div>
          <div class="planning-card__days">${esc(c.days)}</div>
          <div class="planning-card__time">${esc(c.time)}</div>
        </div>`).join('') + '</div>'
    : '<p style="color:var(--ash-2);font-size:.9rem;font-family:var(--mono);">Planning à configurer dans l\'administration.</p>';

  // ── Map ──
  const mapContent = d.mapEmbed
    ? `<iframe src="${esc(d.mapEmbed)}" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Plan ${esc(d.name)}" style="width:100%;height:380px;border:none;display:block;"></iframe>`
    : '';

  const block = document.createElement('div');
  block.className = 'dojo-block reveal' + (i === 0 ? ' is-active' : '');
  block.style.display = i === 0 ? 'block' : 'none';
  block.dataset.index = i;
  block.innerHTML = `
    <div class="dojo-block__header">
      ${d.logo ? `<img src="${esc(d.logo)}" alt="Logo ${esc(shortName)}" class="dojo-block__logo">` : ''}
      <div>
        <div class="dojo-block__name">${esc(shortName)}</div>
        <div class="dojo-block__sub">${esc(d.address) || 'Adresse à renseigner'}</div>
      </div>
    </div>

    <div class="dojo-subsection" data-bureau="${i}">
      <div class="dojo-subsection__title">👥 Le Bureau</div>
      <div class="bureau-grid"></div>
    </div>

    <div class="dojo-subsection">
      <div class="dojo-subsection__title">🏯 Le Dojo</div>
      <div class="dojo-info-list">
        ${d.phone ? `<div class="dojo-item"><span class="dojo-item__label">Téléphone</span><span class="dojo-item__value">${esc(d.phone)}</span></div>` : ''}
        ${d.acces ? `<div class="dojo-item"><span class="dojo-item__label">Accès</span><span class="dojo-item__value">${esc(d.acces)}</span></div>` : ''}
        ${d.instructeur ? `<div class="dojo-item"><span class="dojo-item__label">Instructeur référent</span><span class="dojo-item__value">${esc(d.instructeur)}</span></div>` : ''}
        ${d.mapLink && d.mapLink !== '#' ? `<div class="dojo-item"><span class="dojo-item__label">Itinéraire</span><span class="dojo-item__value"><a href="${esc(d.mapLink)}" target="_blank" rel="noopener" style="color:var(--crimson-2);text-decoration:none;">Ouvrir dans Maps →</a></span></div>` : ''}
      </div>
      ${mapContent}
    </div>

    <div class="dojo-subsection">
      <div class="dojo-subsection__title">📅 Les Cours</div>
      ${coursHTML}
    </div>`;

  container.appendChild(block);

  // Peupler la grille bureau avec des cartes style coach
  const bureauGrid = block.querySelector('[data-bureau] .bureau-grid');
  if (bureauGrid) {
    [
      { role: 'Président',  icon: '👑', name: d.president,  phone: d.presidentPhone,  email: d.presidentEmail,  photo: d.presidentPhoto,  initials: d.presidentInitials  },
      { role: 'Trésorier',  icon: '💼', name: d.tresorier,  phone: d.tresorierPhone,  email: d.tresorierEmail,  photo: d.tresorierPhoto,  initials: d.tresorierInitials  },
      { role: 'Secrétaire', icon: '📋', name: d.secretaire, phone: d.secretairePhone, email: d.secretaireEmail, photo: d.secretairePhoto, initials: d.secretaireInitials },
    ].forEach(m => bureauGrid.appendChild(bureauCard(m.role, m.icon, m.name, m.phone, m.email, m.photo, m.initials)));
  }
});

// Navigation onglets dojos
dojosTabs.addEventListener('click', e => {
  const btn = e.target.closest('.dojo-tab');
  if (!btn) return;
  const idx = btn.dataset.index;
  dojosTabs.querySelectorAll('.dojo-tab').forEach(b => b.classList.remove('is-active'));
  container.querySelectorAll('.dojo-block').forEach(p => { p.style.display = 'none'; });
  btn.classList.add('is-active');
  container.querySelector(`.dojo-block[data-index="${idx}"]`).style.display = 'block';
});

initScrollReveal();
initAdminBar('dojos');
}); // fin initData
</script>
</body>
</html>
