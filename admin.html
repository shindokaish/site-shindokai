<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — EKSN</title>
<link rel="icon" href="shinodkai.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
body { background: #0a0a0c; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.admin-login {
  background: #151518; border: 1px solid rgba(224,36,27,.3);
  padding: 3rem 2.5rem; width: 100%; max-width: 400px;
  box-shadow: 0 0 80px -20px rgba(224,36,27,.25);
  display: flex; flex-direction: column; gap: 1.6rem;
}
.al-header { text-align: center; }
.al-logo { width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(224,36,27,.4); padding: 5px; margin: 0 auto 1.2rem; }
.al-logo img { width: 100%; border-radius: 50%; }
.al-title { font-family: var(--display); font-size: 1.6rem; text-transform: uppercase; color: var(--crimson-2); }
.al-sub { font-family: var(--mono); font-size: .7rem; color: var(--ash-2); letter-spacing: .1em; text-transform: uppercase; margin-top: .4rem; }
.al-field { display: flex; flex-direction: column; gap: .4rem; }
.al-label { font-family: var(--eyebrow); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ash-2); }
.al-input {
  background: #1e1e22; border: 1px solid var(--line); color: var(--bone);
  padding: .85rem 1rem; font-family: var(--body); font-size: 1rem; width: 100%;
  transition: border-color .2s;
}
.al-input:focus { border-color: var(--crimson-2); outline: none; }
.al-btn {
  background: var(--crimson-2); color: #fff; font-family: var(--eyebrow);
  font-size: .85rem; letter-spacing: .1em; text-transform: uppercase;
  padding: 1rem; border: none; cursor: pointer; width: 100%;
  transition: background .2s;
}
.al-btn:hover { background: #c01f17; }
.al-btn:disabled { opacity: .5; cursor: not-allowed; }
.al-err {
  font-family: var(--mono); font-size: .78rem; color: var(--crimson-2);
  background: rgba(224,36,27,.1); border: 1px solid rgba(224,36,27,.2);
  padding: .6rem .9rem; display: none;
}
.al-back { text-align: center; font-family: var(--mono); font-size: .7rem; }
.al-back a { color: var(--ash-2); text-decoration: none; transition: color .2s; }
.al-back a:hover { color: var(--ash); }
</style>
</head>
<body>
<div class="admin-login">
  <div class="al-header">
    <div class="al-logo"><img src="shinodkai.png" alt="EKSN"></div>
    <div class="al-title">Administration</div>
    <div class="al-sub">Accès réservé</div>
  </div>
  <div class="al-field">
    <label class="al-label" for="adminPwd">Mot de passe</label>
    <input id="adminPwd" class="al-input" type="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <div class="al-err" id="adminErr">Mot de passe incorrect.</div>
  <button class="al-btn" id="adminBtn">Accéder au site</button>
  <button class="al-btn" id="adminDashBtn" style="background:transparent;border:1px solid rgba(224,36,27,.4);color:var(--crimson-2);margin-top:-.8rem;">Tableau de bord admin</button>
  <div class="al-back"><a href="index.html">← Retour au site</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/data.js"></script>
<script>
initData().then(() => {
  const btn = document.getElementById('adminBtn');
  const pwd = document.getElementById('adminPwd');
  const err = document.getElementById('adminErr');

  document.getElementById('adminDashBtn').addEventListener('click', () => {
    const data = getData();
    const correct = (data && data.adminPassword) ? data.adminPassword : 'shindo2025';
    if (pwd.value === correct) {
      try { sessionStorage.setItem('shindokai_admin', '1'); } catch(e) {}
      window.location.href = 'admin-dashboard.html';
    } else { err.style.display = 'block'; pwd.value = ''; pwd.focus(); }
  });

  function tryLogin() {
    const data = getData();
    const correct = (data && data.adminPassword) ? data.adminPassword : 'shindo2025';
    if (pwd.value === correct) {
      try { sessionStorage.setItem('shindokai_admin', '1'); } catch(e) {}
      window.location.href = 'index.html';
    } else {
      err.style.display = 'block';
      pwd.value = ''; pwd.focus();
    }
  }
  btn.addEventListener('click', tryLogin);
  pwd.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
  pwd.focus();
});
</script>
</body>
</html>
